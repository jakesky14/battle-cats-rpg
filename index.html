<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Battle Cats RPG — Test Arena</title>
<style>
  html, body {
    margin: 0;
    background: #1a1f16;
    color: #eee;
    font-family: 'Trebuchet MS', sans-serif;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    width: 960px;
    margin: 20px auto;
  }
  canvas {
    background: #3a5a2a;
    border: 4px solid #222;
    border-radius: 8px;
    display: block;
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    font-size: 13px;
  }
  .bar-bg {
    width: 220px;
    height: 14px;
    background: #000a;
    border: 1px solid #000;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 3px;
  }
  .bar-fill {
    height: 100%;
    transition: width 0.1s linear;
  }
  #playerHp .bar-fill { background: #4aa3ff; }
  #enemyCount {
    text-align: right;
    font-size: 14px;
  }
  #cooldowns {
    position: absolute;
    bottom: 10px;
    left: 10px;
    display: flex;
    gap: 10px;
    font-size: 11px;
    pointer-events: none;
  }
  .cd-box {
    width: 70px;
  }
  .cd-bg {
    width: 100%;
    height: 8px;
    background: #000a;
    border: 1px solid #000;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 2px;
  }
  .cd-fill {
    height: 100%;
    background: #4aa3ff;
    width: 100%;
  }
  #msg {
    position: absolute;
    top: 40%;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    text-shadow: 0 2px 4px #000;
    pointer-events: none;
    display: none;
  }
  #instructions {
    position: absolute;
    bottom: 10px;
    right: 10px;
    text-align: right;
    font-size: 11px;
    opacity: 0.75;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="600"></canvas>
  <div id="hud">
    <div id="playerHp">
      Player HP
      <div class="bar-bg"><div class="bar-fill" style="width:100%"></div></div>
    </div>
    <div id="enemyCount">Enemies: <span id="enemyCountVal">3</span></div>
  </div>
  <div id="cooldowns">
    <div class="cd-box">Attack<div class="cd-bg"><div id="atkCd" class="cd-fill"></div></div></div>
    <div class="cd-box">Dash<div class="cd-bg"><div id="dashCd" class="cd-fill"></div></div></div>
  </div>
  <div id="msg"></div>
  <div id="instructions">Arrow keys move · Space attack · Shift dash · R restart</div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const playerHpFill = document.querySelector('#playerHp .bar-fill');
const enemyCountVal = document.getElementById('enemyCountVal');
const atkCdFill = document.getElementById('atkCd');
const dashCdFill = document.getElementById('dashCd');
const msgEl = document.getElementById('msg');

// Raw "speed" stats (15 / 10 / ...) are small design units, not pixels/sec on their own.
// This converts them to a workable on-screen pace; tune freely.
const SPEED_SCALE = 10;

const START = { x: 80, y: 300 };

// Solid walls: block movement, block line of sight, and block attacks that
// try to pass through them.
const walls = [
  { x: 420, y: 0, w: 40, h: 260 },
  { x: 420, y: 380, w: 40, h: 220 },
  { x: 680, y: 260, w: 140, h: 40 },
];

// Pits: instant player death + respawn at START, do not block sight or movement
// for enemies (only the player can fall in).
const pits = [
  { x: 260, y: 420, w: 90, h: 70 },
  { x: 760, y: 430, w: 80, h: 70 },
];

const keys = {};
const prevKeys = {};

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if (e.code === 'KeyR') resetGame();
});
window.addEventListener('keyup', e => keys[e.code] = false);

function justPressed(code) {
  return keys[code] && !prevKeys[code];
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

function circleRectPush(x, y, r, rect) {
  const cx = clamp(x, rect.x, rect.x + rect.w);
  const cy = clamp(y, rect.y, rect.y + rect.h);
  const dx = x - cx, dy = y - cy;
  const d = Math.hypot(dx, dy);
  if (d < r && d > 0) {
    const push = r - d;
    return { x: x + (dx / d) * push, y: y + (dy / d) * push };
  }
  if (d === 0) return { x: x, y: y - r };
  return null;
}

function circleOverlapsRect(x, y, r, rect) {
  const cx = clamp(x, rect.x, rect.x + rect.w);
  const cy = clamp(y, rect.y, rect.y + rect.h);
  return dist(x, y, cx, cy) < r;
}

function resolveObstacles(entity) {
  for (const w of walls) {
    const res = circleRectPush(entity.x, entity.y, entity.r, w);
    if (res) { entity.x = res.x; entity.y = res.y; }
  }
  entity.x = clamp(entity.x, entity.r, W - entity.r);
  entity.y = clamp(entity.y, entity.r, H - entity.r);
}

function ccw(ax, ay, bx, by, cx, cy) { return (cy - ay) * (bx - ax) > (by - ay) * (cx - ax); }
function segmentsIntersect(ax, ay, bx, by, cx, cy, dx, dy) {
  return (ccw(ax, ay, cx, cy, dx, dy) !== ccw(bx, by, cx, cy, dx, dy)) &&
         (ccw(ax, ay, bx, by, cx, cy) !== ccw(ax, ay, bx, by, dx, dy));
}
function pointInRect(px, py, rect) {
  return px >= rect.x && px <= rect.x + rect.w && py >= rect.y && py <= rect.y + rect.h;
}
function lineIntersectsRect(x1, y1, x2, y2, rect) {
  if (pointInRect(x1, y1, rect) || pointInRect(x2, y2, rect)) return true;
  const rx = rect.x, ry = rect.y, rx2 = rect.x + rect.w, ry2 = rect.y + rect.h;
  const corners = [[rx, ry], [rx2, ry], [rx2, ry2], [rx, ry2]];
  for (let i = 0; i < 4; i++) {
    const [cx1, cy1] = corners[i];
    const [cx2, cy2] = corners[(i + 1) % 4];
    if (segmentsIntersect(x1, y1, x2, y2, cx1, cy1, cx2, cy2)) return true;
  }
  return false;
}
function hasLineOfSight(x1, y1, x2, y2) {
  for (const w of walls) {
    if (lineIntersectsRect(x1, y1, x2, y2, w)) return false;
  }
  return true;
}

const PLAYER_STATS = {
  hpMax: 1000,
  atk: 100,
  atkRange: 150,
  speed: 15,
  dashMultiplier: 2,
  dashDuration: 0.25,   // assumption: not specified, tune freely
  dashCooldown: 1.0,    // assumption: not specified, tune freely
  atkCooldown: 2.0,
  atkWindup: 0.25,      // assumption: brief wind-up so the telegraph circle is visible
  radius: 20,
};

// Only the original enemy's stats were specified. The archer and tank stats
// below are new assumptions, tuned to feel distinct — adjust freely.
const ENEMY_DEFS = {
  grunt: {
    hpMax: 500, atk: 80, atkRange: 150, speed: 10,
    atkFrequency: 2.0, atkWindup: 0.3, attackMode: 'melee',
    halfSize: 18, color: '#c0392b', shape: 'square',
  },
  archer: {
    hpMax: 320, atk: 60, atkRange: 320, speed: 8,
    atkFrequency: 1.8, atkWindup: 0.4, attackMode: 'ranged',
    halfSize: 16, color: '#e0862a', shape: 'triangle', reticleRadius: 55,
  },
  tank: {
    hpMax: 800, atk: 130, atkRange: 140, speed: 6,
    atkFrequency: 2.6, atkWindup: 0.45, attackMode: 'melee',
    halfSize: 26, color: '#7a3fae', shape: 'square',
  },
};

const ENEMY_SPAWNS = [
  { type: 'grunt', x: 560, y: 500 },
  { type: 'archer', x: 860, y: 200 },
  { type: 'tank', x: 560, y: 120 },
];

let player, enemies, telegraphs, particles, gameOver, frozenTimer;

function resetGame() {
  player = {
    x: START.x, y: START.y, r: PLAYER_STATS.radius,
    hp: PLAYER_STATS.hpMax,
    facing: 0,
    isDashing: false, dashTimer: 0, dashCdTimer: 0,
    atkCdTimer: 0,
    hitFlash: 0,
  };
  enemies = ENEMY_SPAWNS.map(s => {
    const def = ENEMY_DEFS[s.type];
    return {
      def, x: s.x, y: s.y, r: def.halfSize,
      hp: def.hpMax,
      state: 'chase',
      windupTimer: 0, cooldownTimer: 0,
      hitFlash: 0,
    };
  });
  telegraphs = [];
  particles = [];
  gameOver = false;
  frozenTimer = 0;
  msgEl.style.display = 'none';
}

function spawnHit(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2;
    const speed = 60 + Math.random() * 120;
    particles.push({
      x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
      life: 0.35, maxLife: 0.35, color,
    });
  }
}

function spawnTelegraph(cx, cy, radius, windup, damage, target, ownerX, ownerY) {
  telegraphs.push({
    x: cx, y: cy, r: radius,
    timer: windup, resolved: false,
    impactFlash: 0, damage, target, ownerX, ownerY,
  });
}

function updatePlayer(dt) {
  if (player.atkCdTimer > 0) player.atkCdTimer -= dt;
  if (player.dashCdTimer > 0) player.dashCdTimer -= dt;
  if (player.hitFlash > 0) player.hitFlash -= dt;

  let mx = 0, my = 0;
  if (keys['ArrowUp']) my -= 1;
  if (keys['ArrowDown']) my += 1;
  if (keys['ArrowLeft']) mx -= 1;
  if (keys['ArrowRight']) mx += 1;
  const mlen = Math.hypot(mx, my);
  if (mlen > 0) {
    mx /= mlen; my /= mlen;
    player.facing = Math.atan2(my, mx);
  }

  if (justPressed('ShiftLeft') || justPressed('ShiftRight')) {
    if (player.dashCdTimer <= 0 && !player.isDashing) {
      player.isDashing = true;
      player.dashTimer = PLAYER_STATS.dashDuration;
      player.dashCdTimer = PLAYER_STATS.dashCooldown;
    }
  }

  let speed = PLAYER_STATS.speed * SPEED_SCALE;
  if (player.isDashing) {
    speed *= PLAYER_STATS.dashMultiplier;
    player.dashTimer -= dt;
    if (player.dashTimer <= 0) player.isDashing = false;
  }

  const moveDx = mlen > 0 ? mx : Math.cos(player.facing);
  const moveDy = mlen > 0 ? my : Math.sin(player.facing);
  if (mlen > 0 || player.isDashing) {
    player.x += moveDx * speed * dt;
    player.y += moveDy * speed * dt;
  }
  resolveObstacles(player);

  if (justPressed('Space') && player.atkCdTimer <= 0) {
    player.atkCdTimer = PLAYER_STATS.atkCooldown;
    const fx = Math.cos(player.facing), fy = Math.sin(player.facing);
    const r = PLAYER_STATS.atkRange / 2;
    spawnTelegraph(
      player.x + fx * r, player.y + fy * r,
      r, PLAYER_STATS.atkWindup, PLAYER_STATS.atk, 'enemies',
      player.x, player.y
    );
  }
}

function updateEnemy(e, dt) {
  if (e.hp <= 0) return;
  if (e.hitFlash > 0) e.hitFlash -= dt;

  if (e.state === 'telegraph') {
    e.windupTimer -= dt;
    if (e.windupTimer <= 0) {
      e.state = 'cooldown';
      e.cooldownTimer = e.def.atkFrequency - e.def.atkWindup;
    }
    return;
  }
  if (e.state === 'cooldown') {
    e.cooldownTimer -= dt;
    if (e.cooldownTimer <= 0) {
      e.state = hasLineOfSight(e.x, e.y, player.x, player.y) ? 'chase' : 'idle';
    }
    return;
  }

  const canSee = hasLineOfSight(e.x, e.y, player.x, player.y);
  if (!canSee) { e.state = 'idle'; return; }
  e.state = 'chase';

  const d = dist(e.x, e.y, player.x, player.y);
  if (d > e.def.atkRange * 0.9) {
    const a = Math.atan2(player.y - e.y, player.x - e.x);
    e.x += Math.cos(a) * e.def.speed * SPEED_SCALE * dt;
    e.y += Math.sin(a) * e.def.speed * SPEED_SCALE * dt;
    resolveObstacles(e);
  } else {
    e.state = 'telegraph';
    e.windupTimer = e.def.atkWindup;
    let cx, cy, r;
    if (e.def.attackMode === 'ranged') {
      cx = player.x; cy = player.y; r = e.def.reticleRadius;
    } else {
      const a = Math.atan2(player.y - e.y, player.x - e.x);
      r = e.def.atkRange / 2;
      cx = e.x + Math.cos(a) * r;
      cy = e.y + Math.sin(a) * r;
    }
    spawnTelegraph(cx, cy, r, e.def.atkWindup, e.def.atk, 'player', e.x, e.y);
  }
}

function updateTelegraphs(dt) {
  for (let i = telegraphs.length - 1; i >= 0; i--) {
    const t = telegraphs[i];
    if (!t.resolved) {
      t.timer -= dt;
      if (t.timer <= 0) {
        t.resolved = true;
        t.impactFlash = 0.15;
        if (t.target === 'player') {
          if (player.hp > 0 && dist(t.x, t.y, player.x, player.y) < t.r + player.r &&
              hasLineOfSight(t.ownerX, t.ownerY, player.x, player.y)) {
            player.hp -= t.damage;
            player.hitFlash = 0.2;
            spawnHit(player.x, player.y, '#ff6161');
          }
        } else {
          for (const en of enemies) {
            if (en.hp <= 0) continue;
            if (dist(t.x, t.y, en.x, en.y) < t.r + en.r &&
                hasLineOfSight(t.ownerX, t.ownerY, en.x, en.y)) {
              en.hp -= t.damage;
              en.hitFlash = 0.2;
              spawnHit(en.x, en.y, '#ffd35c');
            }
          }
        }
      }
    } else {
      t.impactFlash -= dt;
      if (t.impactFlash <= 0) telegraphs.splice(i, 1);
    }
  }
}

function checkPits() {
  for (const p of pits) {
    if (circleOverlapsRect(player.x, player.y, player.r, p)) {
      frozenTimer = 1.0;
      msgEl.textContent = 'Fell into a pit!';
      msgEl.style.color = '#ffcc66';
      msgEl.style.display = 'block';
      return;
    }
  }
}

function update(dt) {
  if (gameOver) {
    prevKeys.Space = keys['Space']; prevKeys.ShiftLeft = keys['ShiftLeft']; prevKeys.ShiftRight = keys['ShiftRight'];
    return;
  }

  if (frozenTimer > 0) {
    frozenTimer -= dt;
    if (frozenTimer <= 0) {
      player.x = START.x; player.y = START.y; player.hp = PLAYER_STATS.hpMax;
      msgEl.style.display = 'none';
    }
    prevKeys.Space = keys['Space']; prevKeys.ShiftLeft = keys['ShiftLeft']; prevKeys.ShiftRight = keys['ShiftRight'];
    return;
  }

  updatePlayer(dt);
  for (const e of enemies) updateEnemy(e, dt);
  updateTelegraphs(dt);
  checkPits();

  if (frozenTimer <= 0) {
    if (enemies.every(e => e.hp <= 0)) endGame(true);
    if (player.hp <= 0) { player.hp = 0; endGame(false); }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vx *= 0.9; pt.vy *= 0.9;
    pt.life -= dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }

  playerHpFill.style.width = (Math.max(0, player.hp) / PLAYER_STATS.hpMax * 100) + '%';
  enemyCountVal.textContent = enemies.filter(e => e.hp > 0).length;
  atkCdFill.style.width = (100 - clamp(player.atkCdTimer / PLAYER_STATS.atkCooldown, 0, 1) * 100) + '%';
  dashCdFill.style.width = (100 - clamp(player.dashCdTimer / PLAYER_STATS.dashCooldown, 0, 1) * 100) + '%';

  prevKeys.Space = keys['Space'];
  prevKeys.ShiftLeft = keys['ShiftLeft'];
  prevKeys.ShiftRight = keys['ShiftRight'];
}

function endGame(playerWon) {
  gameOver = true;
  msgEl.textContent = (playerWon ? 'ALL ENEMIES DEFEATED' : 'YOU DIED') + ' — press R to restart';
  msgEl.style.color = playerWon ? '#8cff8c' : '#ff6b6b';
  msgEl.style.display = 'block';
}

function drawEnemy(e) {
  if (e.hp <= 0) return;
  const s = e.def.halfSize;
  const color = e.hitFlash > 0 ? '#ffffff' : e.def.color;
  ctx.fillStyle = color;
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 2;
  if (e.def.shape === 'triangle') {
    ctx.beginPath();
    ctx.moveTo(e.x, e.y - s);
    ctx.lineTo(e.x - s, e.y + s);
    ctx.lineTo(e.x + s, e.y + s);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  } else {
    ctx.fillRect(e.x - s, e.y - s, s * 2, s * 2);
    ctx.strokeRect(e.x - s, e.y - s, s * 2, s * 2);
  }

  const barW = 40, barH = 5;
  const pct = Math.max(0, e.hp) / e.def.hpMax;
  const bx = e.x - barW / 2, by = e.y - s - 14;
  ctx.fillStyle = '#000a';
  ctx.fillRect(bx, by, barW, barH);
  ctx.fillStyle = '#ff5050';
  ctx.fillRect(bx, by, barW * pct, barH);

  if (e.state === 'idle') {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('?', e.x, by - 4);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for (let gx = 0; gx < W; gx += 40) {
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
  }
  for (let gy = 0; gy < H; gy += 40) {
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
  }

  for (const p of pits) {
    ctx.beginPath();
    ctx.ellipse(p.x + p.w / 2, p.y + p.h / 2, p.w / 2, p.h / 2, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#0a0a0a';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,80,80,0.6)';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  for (const w of walls) {
    ctx.fillStyle = '#4a4f42';
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeStyle = '#22251d';
    ctx.lineWidth = 2;
    ctx.strokeRect(w.x, w.y, w.w, w.h);
  }

  for (const t of telegraphs) {
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
    if (!t.resolved) {
      ctx.fillStyle = 'rgba(255,40,40,0.28)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,40,40,0.6)';
      ctx.lineWidth = 2;
      ctx.stroke();
    } else {
      ctx.fillStyle = `rgba(255,120,40,${clamp(t.impactFlash / 0.15, 0, 1) * 0.5})`;
      ctx.fill();
    }
  }

  for (const e of enemies) drawEnemy(e);

  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
  ctx.fillStyle = player.hitFlash > 0 ? '#ffffff' : '#4aa3ff';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(player.x + Math.cos(player.facing) * player.r, player.y + Math.sin(player.facing) * player.r);
  ctx.lineTo(player.x + Math.cos(player.facing) * (player.r + 12), player.y + Math.sin(player.facing) * (player.r + 12));
  ctx.strokeStyle = '#1c1c1c';
  ctx.lineWidth = 3;
  ctx.stroke();

  for (const pt of particles) {
    ctx.globalAlpha = clamp(pt.life / pt.maxLife, 0, 1);
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
