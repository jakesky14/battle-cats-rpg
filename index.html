<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Battle Cats: The Legend of Behemoth Island</title>
<style>
  html, body {
    margin: 0;
    background: #1a1f16;
    color: #eee;
    font-family: 'Trebuchet MS', sans-serif;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    width: 960px;
    margin: 20px auto;
  }
  canvas {
    background: #3a5a2a;
    border: 4px solid #222;
    border-radius: 8px;
    display: block;
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: start;
    pointer-events: none;
    font-size: 13px;
  }
  #topRight { text-align: right; }
  #levelXp { text-align: right; font-size: 14px; color: #4aa3ff; font-weight: bold; margin-top: 28px; margin-bottom: 6px; }
  .bar-bg {
    width: 220px;
    height: 14px;
    background: #000a;
    border: 1px solid #000;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 3px;
  }
  .bar-fill {
    height: 100%;
    transition: width 0.1s linear;
  }
  #playerHp .bar-fill { background: #4aa3ff; }
  #cooldowns {
    position: absolute;
    bottom: 10px;
    left: 10px;
    display: flex;
    gap: 10px;
    font-size: 11px;
    pointer-events: none;
  }
  .cd-box { width: 70px; }
  .cd-bg {
    width: 100%;
    height: 8px;
    background: #000a;
    border: 1px solid #000;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 2px;
  }
  .cd-fill { height: 100%; background: #4aa3ff; width: 100%; }
  #msg {
    position: absolute;
    top: 38%;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    text-shadow: 0 2px 4px #000;
    pointer-events: none;
    display: none;
  }
  #msg.msg-tutorial, #msg.msg-clickable { pointer-events: auto; cursor: pointer; }
  #msg.msg-tutorial { font-size: 22px; }
  .msg-sub { font-size: 15px; font-weight: normal; margin-top: 10px; opacity: 0.85; }
  #toasts {
    position: absolute;
    top: 54px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    pointer-events: none;
  }
  .toast {
    background: #000c;
    padding: 6px 14px;
    border-radius: 14px;
    font-size: 13px;
    animation: toastIn 0.2s ease-out;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

  #titleScreen, #cutsceneScreen, #menuScreen, #chooseFileScreen {
    position: absolute;
    inset: 4px;
    z-index: 10;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #12160f;
    border-radius: 4px;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  #titleScreen h1 {
    font-size: 34px;
    margin: 0 0 22px;
    color: #ffd35c;
    text-shadow: 0 3px 6px #000;
    max-width: 700px;
  }
  .prompt { font-size: 15px; opacity: 0.85; animation: pulse 1.4s ease-in-out infinite; }
  #titleButtons { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
  .title-btn {
    background: #333; border: 1px solid #555; color: #eee;
    padding: 10px 30px; border-radius: 6px; font-size: 15px; cursor: pointer;
    letter-spacing: 0.5px;
  }
  .title-btn:hover:not(:disabled) { background: #444; }
  .title-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #chooseFileSlots { display: flex; flex-direction: column; gap: 8px; margin-top: 24px; }
  .file-row { display: flex; align-items: center; gap: 14px; }
  .file-row span { flex: 1; text-align: left; font-size: 13px; }
  .delete-btn {
    background: #6b1f1f; border: 1px solid #a33; color: #fff;
    padding: 6px 16px; border-radius: 5px; font-size: 12px; cursor: pointer;
  }
  .delete-btn:hover:not(:disabled) { background: #872727; }
  .delete-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  #cutsceneScreen { justify-content: space-between; }
  .cutscene-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 100px;
  }
  .cutscene-actor { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cutscene-actor span { font-size: 14px; }
  .pixel-sprite { image-rendering: pixelated; image-rendering: crisp-edges; }
  #cutsceneEggImg { filter: drop-shadow(0 0 14px #ffe27a); }
  .cutscene-box {
    width: 100%;
    background: #000a;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 16px;
    box-sizing: border-box;
    min-height: 76px;
  }
  #cutsceneLine { font-size: 16px; margin-bottom: 8px; }

  #menuScreen { justify-content: flex-start; padding-top: 30px; }
  .menu-panel { width: 100%; height: 100%; display: flex; flex-direction: column; }
  .menu-tabs { display: flex; gap: 8px; margin-bottom: 16px; justify-content: center; }
  .menu-tabs button {
    background: #333; border: 1px solid #555; color: #eee;
    padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 14px;
  }
  .menu-tabs button.active { background: #4aa3ff; border-color: #4aa3ff; color: #111; }
  .menu-tabs kbd { background: #0006; padding: 1px 5px; border-radius: 3px; margin-left: 4px; font-size: 11px; }
  .menu-content { flex: 1; text-align: left; padding: 0 50px; overflow: auto; }
  .menu-content h2 { margin-top: 0; }
  .upgrade-btn {
    background: #4aa3ff; border: none; color: #fff;
    padding: 10px 22px; border-radius: 5px; font-size: 15px; cursor: pointer;
  }
  .upgrade-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
  .menu-hint { text-align: center; font-size: 11px; opacity: 0.6; padding: 10px; }
  .item-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 14px; }
  .item-swatch { width: 18px; height: 18px; border-radius: 50%; display: inline-block; }

  #dialogueBox {
    position: absolute;
    left: 20px;
    right: 20px;
    bottom: 20px;
    background: #000c;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 14px 18px;
    box-sizing: border-box;
    display: none;
    cursor: pointer;
    z-index: 12;
  }
  #dialogueName { font-weight: bold; color: #ffd35c; margin-bottom: 6px; font-size: 14px; }
  #dialogueText { font-size: 15px; line-height: 1.4; min-height: 40px; }
  #dialogueText .dialogue-small { font-size: 11px; opacity: 0.8; }
  #dialogueBox .prompt { display: block; margin-top: 8px; font-size: 12px; }
  #dialogueChoices { display: none; gap: 10px; margin-top: 10px; }
  #dialogueChoices button {
    background: #4aa3ff; border: none; color: #fff;
    padding: 8px 20px; border-radius: 5px; font-size: 14px; cursor: pointer;
  }
  #dialogueChoices button.no-btn { background: #555; }

  #testModeBtn {
    position: absolute;
    top: 6px;
    right: 6px;
    z-index: 20;
    background: #333;
    color: #eee;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 11px;
    cursor: pointer;
  }
  #testModeBtn.active { background: #2e7d32; border-color: #4caf50; color: #fff; }

  #blackout {
    position: absolute;
    inset: 4px;
    z-index: 16;
    background: #000;
    border-radius: 4px;
    display: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="600"></canvas>
  <button id="testModeBtn">Infinite Health: OFF</button>

  <div id="hud">
    <div id="playerHp">Player HP<div class="bar-bg"><div class="bar-fill" style="width:100%"></div></div></div>
    <div id="topRight">
      <div id="levelXp">XP: 0</div>
    </div>
  </div>
  <div id="cooldowns">
    <div class="cd-box">Attack<div class="cd-bg"><div id="atkCd" class="cd-fill"></div></div></div>
    <div class="cd-box">Dash<div class="cd-bg"><div id="dashCd" class="cd-fill"></div></div></div>
  </div>
  <div id="toasts"></div>
  <div id="msg"></div>
  <div id="dialogueBox">
    <div id="dialogueName"></div>
    <div id="dialogueText"></div>
    <div id="dialoguePrompt" class="prompt">Press Enter (or click) to continue ▸</div>
    <div id="dialogueChoices"></div>
  </div>
  <div id="blackout"></div>

  <div id="titleScreen">
    <h1>Battle Cats: The Legend of Behemoth Island</h1>
    <div id="titleButtons">
      <button id="continueBtn" class="title-btn">CONTINUE</button>
      <button id="newGameBtn" class="title-btn">NEW GAME</button>
    </div>
  </div>

  <div id="chooseFileScreen">
    <h1 style="font-size:20px;">There are no empty files, delete a file.</h1>
    <div id="chooseFileSlots"></div>
    <button id="chooseFileBackBtn" class="title-btn" style="margin-top:20px;">BACK</button>
  </div>

  <div id="cutsceneScreen" style="cursor:pointer;">
    <div class="cutscene-stage">
      <div class="cutscene-actor"><img id="cutsceneCatImg" class="pixel-sprite" width="115" height="120"><span>Researcher Cat</span></div>
      <img id="cutsceneEggImg" class="pixel-sprite" width="100" height="120">
      <img id="cutsceneBagImg" class="pixel-sprite" width="60" height="60" style="display:none;">
      <div class="cutscene-actor" id="cutsceneEnemyActor" style="display:none;"><img id="cutsceneEnemyImg" class="pixel-sprite" width="90" height="105"><span>Wild Doge</span></div>
    </div>
    <div class="cutscene-box">
      <div id="cutsceneLine"></div>
      <div class="prompt">Press any key (or click) to continue ▸</div>
    </div>
  </div>

  <div id="menuScreen">
    <div class="menu-panel">
      <div class="menu-tabs">
        <button data-tab="map">Map <kbd>1</kbd></button>
        <button data-tab="upgrade">Upgrade <kbd>2</kbd></button>
        <button data-tab="items">Items <kbd>3</kbd></button>
      </div>
      <div class="menu-content" id="menuContent"></div>
      <div class="menu-hint">Press M or Esc to close</div>
    </div>
  </div>
</div>

function justPressed(code) { return keys[code] && !prevKeys[code]; }
function justPressedEnter() {
  return anyKeyJustPressed || ((keys['Enter'] || keys['NumpadEnter']) && !(prevKeys.Enter || prevKeys.NumpadEnter));
}

function justPressedEnterKeyOnly() {

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function circleRectPush(x, y, r, rect) {
  const cx = clamp(x, rect.x, rect.x + rect.w);
  const cy = clamp(y, rect.y, rect.y + rect.h);
  const dx = x - cx, dy = y - cy;
  const d = Math.hypot(dx, dy);
  if (d < r && d > 0) {
    const push = r - d;
    return { x: x + (dx / d) * push, y: y + (dy / d) * push };
  }
  if (d === 0) return { x: x, y: y - r };
  return null;
}
function circleOverlapsRect(x, y, r, rect) {
  const cx = clamp(x, rect.x, rect.x + rect.w);
  const cy = clamp(y, rect.y, rect.y + rect.h);
  return dist(x, y, cx, cy) < r;
}
function resolveObstacles(entity) {
  for (const w of walls) {
    const res = circleRectPush(entity.x, entity.y, entity.r, w);
    if (res) { entity.x = res.x; entity.y = res.y; }
  }
  entity.x = clamp(entity.x, entity.r, worldW - entity.r);
  entity.y = clamp(entity.y, entity.r, worldH - entity.r);
}
function updateCamera() {
  camera.x = clamp(player.x - W / 2, 0, Math.max(0, worldW - W));
  camera.y = clamp(player.y - H / 2, 0, Math.max(0, worldH - H));
}
function isOnScreen(x, y) {
  return x >= camera.x && x <= camera.x + W && y >= camera.y && y <= camera.y + H;
}

function ccw(ax, ay, bx, by, cx, cy) { return (cy - ay) * (bx - ax) > (by - ay) * (cx - ax); }
function segmentsIntersect(ax, ay, bx, by, cx, cy, dx, dy) {
  return (ccw(ax, ay, cx, cy, dx, dy) !== ccw(bx, by, cx, cy, dx, dy)) &&
         (ccw(ax, ay, bx, by, cx, cy) !== ccw(ax, ay, bx, by, dx, dy));
}
function pointInRect(px, py, rect) {
  return px >= rect.x && px <= rect.x + rect.w && py >= rect.y && py <= rect.y + rect.h;
}
function lineIntersectsRect(x1, y1, x2, y2, rect) {
  if (pointInRect(x1, y1, rect) || pointInRect(x2, y2, rect)) return true;
  const rx = rect.x, ry = rect.y, rx2 = rect.x + rect.w, ry2 = rect.y + rect.h;
  const corners = [[rx, ry], [rx2, ry], [rx2, ry2], [rx, ry2]];
  for (let i = 0; i < 4; i++) {
    const [cx1, cy1] = corners[i];
    const [cx2, cy2] = corners[(i + 1) % 4];
    if (segmentsIntersect(x1, y1, x2, y2, cx1, cy1, cx2, cy2)) return true;
  }
  return false;
}
function hasLineOfSight(x1, y1, x2, y2) {
  for (const w of walls) {
    if (lineIntersectsRect(x1, y1, x2, y2, w)) return false;
  }
  return true;
}

// Picks whichever interactable (NPC or solid wall like a tent/save point) is
// actually closest, rather than checking in a fixed order — two nearby
// interactables can both be within INTERACT_RANGE at once (e.g. a tent and
// the Behemoth Base only ~64 units apart with a 60-unit range), and a fixed
// checking order would always let one silently win, making the other seem
// broken.
function getNearestInteractable() {
  let best = null, bestDist = INTERACT_RANGE;
  const npcs = ZONES[currentZoneId].npcs || [];
  for (const npc of npcs) {
    const d = dist(player.x, player.y, npc.x, npc.y);
    if (d < bestDist) { bestDist = d; best = { type: 'npc', target: npc }; }
  }
  for (const w of walls) {
    if (!w.interactable) continue;
    // Walls are solid, so measure to the nearest edge, not the center — the
    // player's own collision with the wall keeps them well away from its
    // center for anything but a tiny one.
    const cx = clamp(player.x, w.x, w.x + w.w), cy = clamp(player.y, w.y, w.y + w.h);
    const d = dist(player.x, player.y, cx, cy);
    if (d < bestDist) { bestDist = d; best = { type: w.interactable, target: w }; }
  }
  if (currentZoneId === 'start' && bagDropped) {
    const d = dist(player.x, player.y, BAG_PROP.x, BAG_PROP.y);
    if (d < bestDist) { bestDist = d; best = { type: 'bag', target: BAG_PROP }; }
  }
  if (currentZoneId === 'gapraForest' && !forestBagCollected) {
    const d = dist(player.x, player.y, FOREST_BAG_PROP.x, FOREST_BAG_PROP.y);
    if (d < bestDist) { bestDist = d; best = { type: 'forestBag', target: FOREST_BAG_PROP }; }
  }
  return best;
}

// starting a fresh game) can be undone.
const ORIGINAL_NPC_POS = {};
for (const npc of ZONES.start.npcs) ORIGINAL_NPC_POS[npc.id] = { x: npc.x, y: npc.y };
function resetCampNpcPositions() {
  for (const npc of ZONES.start.npcs) {
    const pos = ORIGINAL_NPC_POS[npc.id];
    if (pos) { npc.x = pos.x; npc.y = pos.y; }
  }
}
// When the Wild Doge attacks, every NPC (plus Medic Cat, who has no normal
// overworld spot of his own) flees to where Biologist Cat normally stands.
// Offsets are spaced generously apart since these sprites are much bigger
// than the old placeholder art.
const CAMP_HUDDLE_OFFSETS = {
  hunter:   { x: -85, y: 50 },
  explorer: { x: 85, y: 50 },
  engineer: { x: -100, y: -20 },
  chef:     { x: 100, y: -20 },
  medic:    { x: 0, y: 90 },
};
// Medic Cat is drawn/attacks like the other huddled NPCs during the
// emergency, without being a permanent ZONES.start.npcs entry (so his usual
// heal-at-tent flow is untouched outside the encounter).
const medicCampNpc = { id: 'medic', name: 'Medic Cat', sprite: medicCatSpriteImg, spriteW: 54, spriteH: 48, x: 0, y: 0 };
function applyCampEmergencyVisuals() {
  const biologist = ORIGINAL_NPC_POS.biologist;
  for (const npc of ZONES.start.npcs) {
    if (npc.id === 'biologist') continue;
    const off = CAMP_HUDDLE_OFFSETS[npc.id];
    if (!off) continue;
    npc.x = biologist.x + off.x;
    npc.y = biologist.y + off.y;
  }
  medicCampNpc.x = biologist.x + CAMP_HUDDLE_OFFSETS.medic.x;
  medicCampNpc.y = biologist.y + CAMP_HUDDLE_OFFSETS.medic.y;
}

const WILD_DOGE_SPAWN = { x: ORIGINAL_NPC_POS.biologist.x - 90, y: ORIGINAL_NPC_POS.biologist.y - 70 };
const WILD_DOGE_LEASH_RANGE = 260; // never wanders far from where the NPCs are huddled
function spawnWildDoge() {

    def: WILD_DOGE_DEF, x: WILD_DOGE_SPAWN.x, y: WILD_DOGE_SPAWN.y, r: WILD_DOGE_DEF.halfSize,

  };

}

// Explorer Cat rushes to help immediately once the alert fires, rather than
// lingering at his normal spot while the player heads back to camp.
function relocateExplorerForAlert() {

  const biologist = ORIGINAL_NPC_POS.biologist;

function triggerEmergencyAlert() {

function triggerCampEncounter() {

// Researcher Cat's bag, dropped near the forest edge after the retreat.
const BAG_PROP = { x: 90, y: 880 };
// The SAME bag, actually found deep in the forest's hidden woodland clearing
// — this is where its Behemoth Stones turn out to be.

function beginRetreatCutscene() {

// Medic Cat's heal-at-tent sequence: he steps out of the tent, the screen
// cuts to black for 2 seconds while the player is healed, then it returns
// and he steps back inside.
const HEAL_APPEAR_TIME = 0.4, HEAL_BLACK_TIME = 2.0, HEAL_RETURN_TIME = 0.4;
function startHealSequence(tentWall) {
  healCutscene = {
    phase: 'appear', timer: HEAL_APPEAR_TIME,
    x: tentWall.x + tentWall.w / 2, y: tentWall.y + tentWall.h + 22,
  };
}
function updateHealCutscene(dt) {
  const hc = healCutscene;
  hc.timer -= dt;
  if (hc.timer > 0) return;
  if (hc.phase === 'appear') {
    hc.phase = 'black';
    hc.timer = HEAL_BLACK_TIME;
    player.hp = PLAYER_STATS.hpMax;
    addToast('Healed to full HP!');
  } else if (hc.phase === 'black') {
    hc.phase = 'return';
    hc.timer = HEAL_RETURN_TIME;
  } else {
    healCutscene = null;
  }
}

const DIALOGUE_CHAR_INTERVAL = 0.08;
function buildDialogueText(parts) {
  let full = '', slowMask = [], smallMask = [], speedMask = [];
  for (const p of parts) {
    for (const ch of p.text) {
      full += ch;
      const isSlow = !!p.slow;
      slowMask.push(isSlow);
      smallMask.push(!!p.small);
      // Periods in a slow-paced line render at half speed (double interval)
      // compared to the rest of that line's characters.
      speedMask.push(isSlow && ch === '.' ? 2 : 1);
    }
  }
  return { full, slowMask, smallMask, speedMask };
}
function updateDialogue(dt) {
  const d = activeDialogue;
  if (!d || d.done) return;
  if (d.revealLength >= d.full.length) { d.done = true; return; }
  if (d.slowMask[d.revealLength]) {
    d.charTimer += dt;
    const interval = DIALOGUE_CHAR_INTERVAL * (d.speedMask ? d.speedMask[d.revealLength] : 1);
    if (d.charTimer >= interval) {
      d.charTimer -= interval;
      d.revealLength++;
    }
  } else {
    while (d.revealLength < d.full.length && !d.slowMask[d.revealLength]) d.revealLength++;
  }
  if (d.revealLength >= d.full.length) d.done = true;
}
function renderDialogueHtml(d) {
  let html = '';
  let i = 0;
  while (i < d.revealLength) {
    const isSmall = d.smallMask[i];
    let j = i;
    while (j < d.revealLength && d.smallMask[j] === isSmall) j++;
    const chunk = escapeHtml(d.full.slice(i, j));
    html += isSmall ? `<span class="dialogue-small">${chunk}</span>` : chunk;
    i = j;
  }
  return html;
}

function startGameSession() {
  screen = 'game';
  recomputePlayerStats();
  player = {
    x: 0, y: 0, r: PLAYER_STATS.radius,
    hp: PLAYER_STATS.hpMax, facing: 0,
    isDashing: false, dashTimer: 0, dashCdTimer: 0,
    atkCdTimer: 0, hitFlash: 0, immuneTimer: 0,
  };
  particles = [];
  toasts = [];
  gameOver = false;
  menuOpen = false;
  activeDialogue = null;
  loadZone(respawnZone, respawnPoint.x, respawnPoint.y);
  if (!tutorialFlags.move) {
    tutorialFlags.move = true;
    frozenMessage = 'Use the arrow keys to move!';
  } else {
    frozenMessage = null;
  }

  // Re-derive the camp-emergency world state from story flags every time a
  // session starts (fresh game, R restart, or loading a save).
  resetCampNpcPositions();
  wildDoge = null;
  if (campEmergency === 'encounter' || campEmergency === 'fled') {
    applyCampEmergencyVisuals();
  } else if (campEmergency === 'alerted') {
    relocateExplorerForAlert();
  }
  if (campEmergency === 'encounter') {
    spawnWildDoge();
  }
}

function spawnHit(x, y, color) {
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2;
    const speed = 60 + Math.random() * 120;
    particles.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 0.35, maxLife: 0.35, color });
  }
}
// Circular area-of-effect telegraph (only Wild Doge uses this — normal
// Doges and Researcher Cat use the thick-line telegraph below).
function spawnTelegraph(cx, cy, radius, windup, damage, target, ownerX, ownerY) {
  telegraphs.push({ shape: 'circle', x: cx, y: cy, r: radius, timer: windup, resolved: false, impactFlash: 0, damage, target, ownerX, ownerY });
}
// Thick straight-line telegraph, swung from (ox, oy) in direction `angle`
// for `length` units, `thickness` units wide.
function spawnLineTelegraph(ox, oy, angle, length, thickness, windup, damage, target) {
  telegraphs.push({ shape: 'line', ox, oy, angle, length, thickness, timer: windup, resolved: false, impactFlash: 0, damage, target, ownerX: ox, ownerY: oy });
}
function distPointToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const lenSq = dx * dx + dy * dy;
  let t = lenSq > 0 ? ((px - x1) * dx + (py - y1) * dy) / lenSq : 0;
  t = clamp(t, 0, 1);
  return dist(px, py, x1 + t * dx, y1 + t * dy);
}
function telegraphHits(t, tx, ty, tr) {
  if (t.shape === 'line') {
    const x2 = t.ox + Math.cos(t.angle) * t.length, y2 = t.oy + Math.sin(t.angle) * t.length;
    return distPointToSegment(tx, ty, t.ox, t.oy, x2, y2) < t.thickness / 2 + tr;
  }
  return dist(t.x, t.y, tx, ty) < t.r + tr;
}
function addToast(text) { toasts.push({ text, life: 2.5 }); }

function updatePlayer(dt) {
  if (player.atkCdTimer > 0) player.atkCdTimer -= dt;
  if (player.dashCdTimer > 0) player.dashCdTimer -= dt;
  if (player.hitFlash > 0) player.hitFlash -= dt;
  if (player.immuneTimer > 0) player.immuneTimer -= dt;

  let mx = 0, my = 0;
  if (keys['ArrowUp']) my -= 1;
  if (keys['ArrowDown']) my += 1;
  if (keys['ArrowLeft']) mx -= 1;
  if (keys['ArrowRight']) mx += 1;
  const mlen = Math.hypot(mx, my);
  if (mlen > 0) {
    mx /= mlen; my /= mlen;
    player.facing = Math.atan2(my, mx);
  }

  if (justPressed('ShiftLeft')) {
    if (player.dashCdTimer <= 0 && !player.isDashing) {
      player.isDashing = true;
      player.dashTimer = PLAYER_STATS.dashDuration;
      player.dashCdTimer = PLAYER_STATS.dashCooldown;
    }
  }

  let speed = PLAYER_STATS.speed * SPEED_SCALE;
  if (player.isDashing) {
    speed *= PLAYER_STATS.dashMultiplier;
    player.dashTimer -= dt;
    if (player.dashTimer <= 0) player.isDashing = false;
  }

  const moveDx = mlen > 0 ? mx : Math.cos(player.facing);
  const moveDy = mlen > 0 ? my : Math.sin(player.facing);
  if (mlen > 0 || player.isDashing) {
    player.x += moveDx * speed * dt;
    player.y += moveDy * speed * dt;
  }
  resolveObstacles(player);

  if (justPressed('Space') && player.atkCdTimer <= 0) {
    player.atkCdTimer = PLAYER_STATS.atkCooldown;
    if (PLAYER_STATS.atkShape === 'circle') {
      spawnTelegraph(player.x, player.y, PLAYER_STATS.atkRange, ATK_WINDUP, PLAYER_STATS.atk, 'enemies', player.x, player.y);
    } else {
      spawnLineTelegraph(player.x, player.y, player.facing, PLAYER_STATS.atkRange, PLAYER_ATK_THICKNESS, ATK_WINDUP, PLAYER_STATS.atk, 'enemies');
    }
  }
}

const ENEMY_RESPAWN_OFFSCREEN_TIME = 60;
function updateEnemy(e, dt) {
  // Respawns the enemy (alive or dead) once its spawn point has been off
  // camera continuously for a full minute, regardless of the enemy's own
  // current (possibly wandered-off) position.
  if (isOnScreen(e.spawnX, e.spawnY)) {
    e.offscreenTimer = 0;
  } else {
    e.offscreenTimer += dt;
    if (e.offscreenTimer >= ENEMY_RESPAWN_OFFSCREEN_TIME) {
      e.hp = e.def.hpMax;
      e.x = e.spawnX;
      e.y = e.spawnY;
      e.state = 'idle';
      e.facingLeft = true;
      e.atkCdTimer = 0;
      e.hitFlash = 0;
      e.lootDropped = false;
      e.offscreenTimer = 0;
    }
  }

  if (e.hp <= 0) return;
  if (e.hitFlash > 0) e.hitFlash -= dt;
  if (e.atkCdTimer > 0) e.atkCdTimer -= dt;

  const canSee = isOnScreen(e.x, e.y) && hasLineOfSight(e.x, e.y, player.x, player.y);
  if (!canSee) { e.state = 'idle'; return; }
  e.state = 'chase';
  e.facingLeft = player.x < e.x;

  const d = dist(e.x, e.y, player.x, player.y);
  if (d > e.def.atkRange * 0.9) {
    const a = Math.atan2(player.y - e.y, player.x - e.x);
    e.x += Math.cos(a) * e.def.speed * SPEED_SCALE * dt;
    e.y += Math.sin(a) * e.def.speed * SPEED_SCALE * dt;
    resolveObstacles(e);
  } else if (e.atkCdTimer <= 0) {
    e.atkCdTimer = e.def.atkFrequency;
    const a = Math.atan2(player.y - e.y, player.x - e.x);
    spawnLineTelegraph(e.x, e.y, a, e.def.atkRange, ENEMY_ATK_THICKNESS, ATK_WINDUP, e.def.atk, 'player');
  }
}

// Wild Doge: a unique camp-emergency boss, tracked separately from the
// regular `enemies` array. True area attack (a circle the size of its
// range), unlike the line attack every normal Doge uses.
function updateWildDoge(dt) {
  const wd = wildDoge;
  if (!wd || wd.hp <= 0) return;
  if (wd.hitFlash > 0) wd.hitFlash -= dt;
  if (wd.atkCdTimer > 0) wd.atkCdTimer -= dt;
  wd.facingLeft = player.x < wd.x;
  wd.state = 'chase';

  const d = dist(wd.x, wd.y, player.x, player.y);
  if (d > wd.def.atkRange * 0.9) {
    const a = Math.atan2(player.y - wd.y, player.x - wd.x);
    const nx = wd.x + Math.cos(a) * wd.def.speed * SPEED_SCALE * dt;
    const ny = wd.y + Math.sin(a) * wd.def.speed * SPEED_SCALE * dt;
    // Stay leashed near the camp/NPCs — never wander further from the spawn
    // point than this, even while chasing a fleeing player.
    const spawnDist = dist(wd.x, wd.y, WILD_DOGE_SPAWN.x, WILD_DOGE_SPAWN.y);
    const newSpawnDist = dist(nx, ny, WILD_DOGE_SPAWN.x, WILD_DOGE_SPAWN.y);
    if (newSpawnDist <= WILD_DOGE_LEASH_RANGE || newSpawnDist < spawnDist) {
      wd.x = nx; wd.y = ny;
      resolveObstacles(wd);
    }
  } else if (wd.atkCdTimer <= 0) {
    wd.atkCdTimer = wd.def.atkFrequency;
    spawnTelegraph(wd.x, wd.y, wd.def.atkRange, ATK_WINDUP, wd.def.atk, 'player', wd.x, wd.y);
  }
}

// While the camp is under attack, every huddled NPC (Medic Cat included)
// takes a swing at the Wild Doge every couple seconds, just like Researcher
// Cat's own space-bar attack (same translucent red line telegraph) — but
// purely for show, so their attacks always deal 0 damage.
const CAMP_NPC_ATK_FREQUENCY = 2.5;
const CAMP_NPC_ATK_RANGE = 130;
const CAMP_NPC_ATK_THICKNESS = 30;
function updateCampEmergencyCombat(dt) {
  if (!wildDoge || wildDoge.hp <= 0) return;
  const combatants = ZONES.start.npcs.filter(n => n.id !== 'biologist').concat([medicCampNpc]);
  for (const npc of combatants) {
    if (campNpcAtkTimers[npc.id] == null) campNpcAtkTimers[npc.id] = Math.random() * CAMP_NPC_ATK_FREQUENCY;
    campNpcAtkTimers[npc.id] -= dt;
    if (campNpcAtkTimers[npc.id] <= 0) {
      campNpcAtkTimers[npc.id] = CAMP_NPC_ATK_FREQUENCY;
      const a = Math.atan2(wildDoge.y - npc.y, wildDoge.x - npc.x);
      spawnLineTelegraph(npc.x, npc.y, a, CAMP_NPC_ATK_RANGE, CAMP_NPC_ATK_THICKNESS, ATK_WINDUP, 0, 'enemies');
    }
  }
}

function updateTelegraphs(dt) {
  for (let i = telegraphs.length - 1; i >= 0; i--) {
    const t = telegraphs[i];
    if (!t.resolved) {
      t.timer -= dt;
      if (t.timer <= 0) {
        t.resolved = true;
        t.impactFlash = 0.15;
        if (t.target === 'player') {
          if (player.hp > 0 && telegraphHits(t, player.x, player.y, player.r) &&
              hasLineOfSight(t.ownerX, t.ownerY, player.x, player.y)) {
            const isCourierCat = getPlayerForm() === 'courierCat';
            if (isCourierCat && player.immuneTimer > 0) {
              // Fully immune — no damage, no dodge roll needed.
            } else if (isCourierCat && Math.random() < COURIER_CAT_DODGE_CHANCE) {
              player.immuneTimer = COURIER_CAT_IMMUNE_DURATION;
              addToast('Courier Cat dodged the attack!');
              spawnHit(player.x, player.y, '#8fe0ff');
            } else {
              let dmg = t.damage;
              if (isCourierCat) dmg *= COURIER_CAT_SLAYER_TAKEN_MULT;
              if (!infiniteHealth) player.hp -= dmg;
              player.hitFlash = 0.2;
              spawnHit(player.x, player.y, '#ff6161');
            }
          }
        } else {
          const isCourierCat = getPlayerForm() === 'courierCat';
          for (const en of enemies) {
            if (en.hp <= 0) continue;
            if (telegraphHits(t, en.x, en.y, en.r) &&
                hasLineOfSight(t.ownerX, t.ownerY, en.x, en.y)) {
              let dmg = t.damage;
              if (isCourierCat) {
                if (en.def.colorTag === 'red') dmg *= COURIER_CAT_RED_MULT;
                if (en.def.isDoge) dmg *= COURIER_CAT_SLAYER_DEALT_MULT;
              }
              en.hp -= dmg;
              en.hitFlash = 0.2;
              spawnHit(en.x, en.y, '#ffd35c');
            }
          }
          if (wildDoge && wildDoge.hp > 0 &&
              telegraphHits(t, wildDoge.x, wildDoge.y, wildDoge.r) &&
              hasLineOfSight(t.ownerX, t.ownerY, wildDoge.x, wildDoge.y)) {
            let wdDmg = t.damage;
            if (isCourierCat && wildDoge.def.isDoge) wdDmg *= COURIER_CAT_SLAYER_DEALT_MULT;
            wildDoge.hp -= wdDmg;
            wildDoge.hitFlash = 0.2;
            spawnHit(wildDoge.x, wildDoge.y, '#ffd35c');
            if (wildDoge.hp <= 0) {
              if (wildDoge.def.survive && Math.random() < wildDoge.def.surviveChance) {
                wildDoge.hp = 1;
                addToast('Wild Doge survives!');
              } else {
                wildDoge.hp = 0;
                addToast('Wild Doge defeated!');
              }
            }
          }
        }
      }
    } else {
      t.impactFlash -= dt;
      if (t.impactFlash <= 0) telegraphs.splice(i, 1);
    }
  }
}

function updateLoot() {
  for (let i = loot.length - 1; i >= 0; i--) {
    const it = loot[i];
    if (dist(player.x, player.y, it.x, it.y) < player.r + it.r) {
      if (it.type === 'stone') {
        inventory.stones[it.color]++;
        addToast('+1 ' + capitalize(it.color) + ' Behemoth Stone');
      } else {
        metaXP += it.amount;
        addToast('+' + it.amount.toLocaleString() + ' XP');
      }
      loot.splice(i, 1);
    }
  }
}

function updateToasts(dt) {
  for (let i = toasts.length - 1; i >= 0; i--) {
    toasts[i].life -= dt;
    if (toasts[i].life <= 0) toasts.splice(i, 1);
  }
}

function doUpdate(dt) {
  if (screen === 'title') {
    return; // waiting on the CONTINUE/NEW GAME button click
  }
  if (screen === 'chooseFile') {
    return; // waiting on a file-slot button click
  }
  if (screen === 'cutscene') {
    if (justPressedEnter()) {
      cutsceneIndex++;
      if (cutsceneIndex >= getCutsceneLines().length) {
        if (cutsceneMode === 'retreat') finishRetreatCutscene();
        else startGameSession();
      }
    }
    return;
  }

  // screen === 'game'
  if (gameOver) {
    if (anyKeyJustPressed) startGameSession();
    return;
  }

  if (healCutscene) {
    updateHealCutscene(dt);
    return;
  }

  if (frozenMessage) {
    // Dismissed via the OK button's onclick handler (see syncOverlays), not a key command.
    return;
  }

  if (activeDialogue) {
    if (justPressedEnterKeyOnly()) {
      if (!activeDialogue.done) {
        activeDialogue.revealLength = activeDialogue.full.length;
        activeDialogue.done = true;
      } else {
        activeDialogue = null;
      }
    }
    if (activeDialogue && !activeDialogue.done) updateDialogue(dt);
    return;
  }

  if (menuOpen) {
    if (justPressed('KeyM') || justPressed('ShiftRight') || justPressed('Escape')) menuOpen = false;
    if (justPressed('Digit1') && menuTab !== 'map') { menuTab = 'map'; renderMenuContent(); }
    if (justPressed('Digit2') && menuTab !== 'upgrade') { menuTab = 'upgrade'; renderMenuContent(); }
    if (justPressed('Digit3') && menuTab !== 'items') { menuTab = 'items'; renderMenuContent(); }
    return;
  }
  if (justPressed('KeyM') || justPressed('ShiftRight')) { menuOpen = true; return; }

  if (justPressedEnterKeyOnly()) {
    const near = getNearestInteractable();
    if (near) {
      if (near.type === 'npc') {
        const parts = near.target.lines();
        activeDialogue = { npc: near.target, ...buildDialogueText(parts), revealLength: 0, charTimer: 0, done: false };
      } else if (near.type === 'medic') {
        const tentWall = near.target;
        if (campEmergency === 'alerted' || campEmergency === 'encounter') {
          activeDialogue = {
            npc: { name: 'Medic Cat' },
            ...buildDialogueText([{ text: "Medic Cat is busy dealing with the emergency — no time to heal right now!" }]),
            revealLength: 0, charTimer: 0, done: false,
          };
        } else {
          const parts = [{ text: "Are you tired? If so then you can heal up." }];
          activeDialogue = {
            npc: { name: 'Medic Cat' }, ...buildDialogueText(parts), revealLength: 0, charTimer: 0, done: false,
            choice: true, choicesRendered: false,
            choices: [
              { label: 'YES', onSelect: () => startHealSequence(tentWall) },
              { label: 'NO', onSelect: () => {} },
            ],
          };
        }
      } else if (near.type === 'save') {
        openSaveLoadMenu();
      } else if (near.type === 'bag') {
        activeDialogue = {
          npc: { name: 'Researcher Cat\'s Bag' },
          ...buildDialogueText([{ text: "It's torn and mostly empty... but there are drag marks leading deeper into the forest." }]),
          revealLength: 0, charTimer: 0, done: false,
        };
      } else if (near.type === 'forestBag') {
        forestBagCollected = true;
        inventory.stones.red += EVOLVE_STONE_COST;
        inventory.stones.purple += EVOLVE_STONE_COST;
        activeDialogue = {
          npc: { name: 'The Bag' },
          ...buildDialogueText([{ text: `You found it! Inside are ${EVOLVE_STONE_COST} Red and ${EVOLVE_STONE_COST} Purple Behemoth Stones — enough to evolve!` }]),
          revealLength: 0, charTimer: 0, done: false,
        };
      }
      return;
    }
  }

  updatePlayer(dt);
  updateCamera();
  checkExits();
  for (const e of enemies) updateEnemy(e, dt);
  updateWildDoge(dt);
  updateCampEmergencyCombat(dt);
  updateTelegraphs(dt);
  updateLoot();
  updateToasts(dt);

  if (campEmergency === 'none' && inventory.stones.red >= EVOLVE_STONE_COST && inventory.stones.purple >= EVOLVE_STONE_COST) {
    triggerEmergencyAlert();
  }
  if (campEmergency === 'alerted' && dist(player.x, player.y, ZONES.start.campfire.x, ZONES.start.campfire.y) < CAMP_ARRIVAL_RADIUS) {
    triggerCampEncounter();
  }

  for (const e of enemies) {
    if (e.hp <= 0 && !e.lootDropped) {
      e.lootDropped = true;
      const color = Math.random() < 0.5 ? 'red' : 'purple';
      loot.push({ type: 'stone', color, x: e.x - 16, y: e.y, r: 14 });
      loot.push({ type: 'xp', amount: ENEMY_XP_DROP, x: e.x + 16, y: e.y, r: 14 });
      addToast('Enemy defeated!');
    }
  }

  if (currentZoneId === 'start' && enemies[0]) {
    const e = enemies[0];
    if (!tutorialFlags.spot && e.hp > 0 && isOnScreen(e.x, e.y) && hasLineOfSight(e.x, e.y, player.x, player.y)) {
      tutorialFlags.spot = true;
      frozenMessage = 'The enemy has spotted you! Use the space bar to attack!';
    }
    if (!tutorialFlags.dash && e.hp > 0 && e.hp <= e.def.hpMax * 0.5) {
      tutorialFlags.dash = true;
      frozenMessage = 'Press Left Shift to dash and dodge enemy attacks! (Right Shift opens the menu)';
    }
  }

  if (player.hp <= 0) {
    player.hp = 0;
    if (campEmergency === 'encounter') beginRetreatCutscene();
    else endGame();
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vx *= 0.9; pt.vy *= 0.9;
    pt.life -= dt;
    if (pt.life <= 0) particles.splice(i, 1);
  }
}

function endGame() {
  gameOver = true;
  msgEl.classList.remove('msg-tutorial');
  msgEl.classList.add('msg-clickable');
  msgEl.textContent = 'YOU DIED — press any key (or click here) to restart';
  msgEl.style.color = '#ff6b6b';
}

// Title screen: CONTINUE resumes the most recent save's Behemoth Base
// (no cutscene replay); NEW GAME starts in the next empty file. If every
// file is full, the player is sent to a delete-a-file screen instead.
function refreshTitleButtons() {
  continueBtnEl.disabled = !getMostRecentSave();
}
function handleContinueGame() {
  if (screen !== 'title') return;
  const recent = getMostRecentSave();
  if (!recent) return;
  activeSaveSlot = recent.slot;
  applySaveData(recent.data);
  startGameSession();
}
function findFirstEmptySlot() {
  for (let slot = 1; slot <= SAVE_SLOT_COUNT; slot++) {
    if (!readSaveSlot(slot)) return slot;
  }
  return null;
}
function beginNewGameInSlot(slot) {
  activeSaveSlot = slot;
  resetToNewGame();
  screen = 'cutscene';
  cutsceneMode = 'intro';
  cutsceneIndex = 0;
}
function handleNewGame() {
  if (screen !== 'title' && screen !== 'chooseFile') return;
  const slot = findFirstEmptySlot();
  if (slot) {
    beginNewGameInSlot(slot);
  } else {
    renderDeleteFileScreen();
    screen = 'chooseFile';
  }
}
function renderDeleteFileScreen() {
  let html = '';
  for (let slot = 1; slot <= SAVE_SLOT_COUNT; slot++) {
    const data = readSaveSlot(slot);
    const label = data
      ? `File ${slot}: Lv ${data.eggLevel} · ${(data.metaXP || 0).toLocaleString()} XP`
      : `File ${slot}: Empty`;
    html += `<div class="file-row"><span>${label}</span><button class="delete-btn" data-delete-slot="${slot}" ${data ? '' : 'disabled'}>DELETE</button></div>`;
  }
  chooseFileSlotsEl.innerHTML = html;
  chooseFileSlotsEl.querySelectorAll('[data-delete-slot]').forEach(btn => {
    btn.addEventListener('click', () => {
      const slot = parseInt(btn.dataset.deleteSlot, 10);
      try { localStorage.removeItem(SAVE_KEY_PREFIX + slot); } catch (e) { /* storage unavailable */ }
      addToast('Deleted File ' + slot + '!');
      // That slot is free now — go ahead and start the new game the player was after.
      beginNewGameInSlot(slot);
    });
  });
}

continueBtnEl.addEventListener('click', handleContinueGame);
newGameBtnEl.addEventListener('click', handleNewGame);
chooseFileBackBtnEl.addEventListener('click', () => {
  refreshTitleButtons();
  screen = 'title';
});
refreshTitleButtons();
cutsceneScreenEl.addEventListener('click', () => {
  if (screen === 'cutscene') {
    cutsceneIndex++;
    if (cutsceneIndex >= getCutsceneLines().length) {
      if (cutsceneMode === 'retreat') finishRetreatCutscene();
      else startGameSession();

});
msgEl.addEventListener('click', () => {

  if (frozenMessage) frozenMessage = null;

});
dialogueBoxEl.addEventListener('click', () => {
  if (!activeDialogue) return;

});

let menuWasOpen = false;
let renderedFrozenMessage = null;

function syncOverlays() {
  blackoutEl.style.display = (screen === 'game' && healCutscene && healCutscene.phase === 'black') ? 'block' : 'none';

  titleScreenEl.style.display = screen === 'title' ? 'flex' : 'none';
  chooseFileScreenEl.style.display = screen === 'chooseFile' ? 'flex' : 'none';
  cutsceneScreenEl.style.display = screen === 'cutscene' ? 'flex' : 'none';
  if (screen === 'cutscene') {
    const lines = getCutsceneLines();
    cutsceneLineEl.textContent = lines[cutsceneIndex];
    const isRetreat = cutsceneMode === 'retreat';
    cutsceneEnemyActorEl.style.display = (isRetreat && cutsceneIndex === 0) ? 'flex' : 'none';
    cutsceneBagImgEl.style.display = (isRetreat && cutsceneIndex === lines.length - 1) ? 'inline-block' : 'none';
  }

  const showMenu = screen === 'game' && menuOpen;
  menuScreenEl.style.display = showMenu ? 'flex' : 'none';
  // Only rebuild menu DOM on open / explicit tab or purchase actions (see those
  // call sites) — never on every animation frame. Rebuilding a button's DOM
  // node while the mouse is mid-click can make the browser drop the click.
  if (showMenu && !menuWasOpen) renderMenuContent();
  menuWasOpen = showMenu;

  if (screen === 'game' && gameOver) {
    msgEl.style.display = 'block';
    renderedFrozenMessage = null;
  } else if (screen === 'game' && frozenMessage && !menuOpen) {
    if (frozenMessage !== renderedFrozenMessage) {
      renderedFrozenMessage = frozenMessage;
      msgEl.classList.remove('msg-clickable');
      msgEl.classList.add('msg-tutorial');
      msgEl.style.color = '#ffe27a';
      msgEl.innerHTML = frozenMessage + '<div class="msg-sub"><button id="tutorialOkBtn" class="upgrade-btn">OK</button></div>';
      const okBtn = document.getElementById('tutorialOkBtn');
      if (okBtn) okBtn.onclick = () => { frozenMessage = null; };
    }
    msgEl.style.display = 'block';
  } else {
    msgEl.style.display = 'none';
    renderedFrozenMessage = null;
  }

  if (screen === 'game' && activeDialogue && !gameOver && !frozenMessage && !menuOpen) {
    dialogueNameEl.textContent = activeDialogue.npc.name;
    dialogueTextEl.innerHTML = renderDialogueHtml(activeDialogue);
    dialogueBoxEl.style.display = 'block';
    const showChoices = !!(activeDialogue.choice && activeDialogue.done);
    dialoguePromptEl.style.display = showChoices ? 'none' : 'block';
    dialogueChoicesEl.style.display = showChoices ? 'flex' : 'none';
    if (showChoices && !activeDialogue.choicesRendered) {
      activeDialogue.choicesRendered = true;
      dialogueChoicesEl.innerHTML = activeDialogue.choices
        .map((c, i) => `<button data-choice-idx="${i}"${i > 0 ? ' class="no-btn"' : ''}>${escapeHtml(c.label)}</button>`)
        .join('');
      activeDialogue.choices.forEach((c, i) => {
        dialogueChoicesEl.querySelector(`[data-choice-idx="${i}"]`).onclick = () => {
          const before = activeDialogue;
          c.onSelect();
          // Some choices (e.g. LOAD) open a new dialogue of their own from
          // inside onSelect — only auto-close if nothing else took over.
          if (activeDialogue === before) activeDialogue = null;
        };
      });
    }
  } else {
    dialogueBoxEl.style.display = 'none';
  }

  toastsEl.innerHTML = toasts.map(t => `<div class="toast">${t.text}</div>`).join('');
}

const ENEMY_SPRITE_SCALE = 2;
const ENEMY_SPRITE_W = 18 * ENEMY_SPRITE_SCALE, ENEMY_SPRITE_H = 21 * ENEMY_SPRITE_SCALE;

function drawEnemy(e) {
  if (e.hp <= 0) return;
  ctx.save();
  ctx.translate(e.x, e.y);
  // Native art faces right, so mirror it when facing left, not the other way.
  if (e.facingLeft) ctx.scale(-1, 1);
  ctx.drawImage(enemySpriteImg, -ENEMY_SPRITE_W / 2, -ENEMY_SPRITE_H / 2, ENEMY_SPRITE_W, ENEMY_SPRITE_H);
  if (e.def.colorTag === 'red') {
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = 'rgba(210,30,30,0.55)';
    ctx.fillRect(-ENEMY_SPRITE_W / 2, -ENEMY_SPRITE_H / 2, ENEMY_SPRITE_W, ENEMY_SPRITE_H);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (e.hitFlash > 0) {
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillRect(-ENEMY_SPRITE_W / 2, -ENEMY_SPRITE_H / 2, ENEMY_SPRITE_W, ENEMY_SPRITE_H);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  const barW = 40, barH = 5;
  const pct = Math.max(0, e.hp) / e.def.hpMax;
  const bx = e.x - barW / 2, by = e.y - ENEMY_SPRITE_H / 2 - 14;
  ctx.fillStyle = '#000a';
  ctx.fillRect(bx, by, barW, barH);
  ctx.fillStyle = '#ff5050';
  ctx.fillRect(bx, by, barW * pct, barH);

  if (e.state === 'idle') {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('?', e.x, by - 4);
    ctx.textAlign = 'left';
  }
}

// Native art is 26x24 (more pixels than the regular Doge's 18x21), drawn at
// the same per-pixel scale as the regular Doge — no extra size multiplier —
// so it comes out bigger purely because its source art has more pixels.
const WILD_DOGE_SPRITE_W = 26 * ENEMY_SPRITE_SCALE, WILD_DOGE_SPRITE_H = 24 * ENEMY_SPRITE_SCALE;
function drawWildDoge(wd) {
  if (wd.hp <= 0) return;
  ctx.save();
  ctx.translate(wd.x, wd.y);
  // Native art faces right, so mirror it when facing left, not the other way.
  if (wd.facingLeft) ctx.scale(-1, 1);
  ctx.drawImage(wildDogeSpriteImg, -WILD_DOGE_SPRITE_W / 2, -WILD_DOGE_SPRITE_H / 2, WILD_DOGE_SPRITE_W, WILD_DOGE_SPRITE_H);
  if (wd.hitFlash > 0) {
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillRect(-WILD_DOGE_SPRITE_W / 2, -WILD_DOGE_SPRITE_H / 2, WILD_DOGE_SPRITE_W, WILD_DOGE_SPRITE_H);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  const barW = 90, barH = 8;
  const pct = Math.max(0, wd.hp) / wd.def.hpMax;
  const bx = wd.x - barW / 2, by = wd.y - WILD_DOGE_SPRITE_H / 2 - 26;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Wild Doge', wd.x, by - 6);
  ctx.fillStyle = '#000a';
  ctx.fillRect(bx, by, barW, barH);
  ctx.fillStyle = '#ff2020';
  ctx.fillRect(bx, by, barW * pct, barH);
  ctx.textAlign = 'left';
}

// Purely decorative rivers/paths — non-blocking, drawn under everything else.
function drawPolylines(list, color) {
  if (!list) return;
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const line of list) {
    ctx.lineWidth = line.width;
    ctx.beginPath();
    line.points.forEach(([x, y], i) => { if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
    ctx.stroke();
  }
  ctx.lineCap = 'butt';
  ctx.lineJoin = 'miter';
}

function drawWall(w) {
  if (w.visual === 'void') {
    ctx.fillStyle = '#10140d';
    ctx.fillRect(w.x, w.y, w.w, w.h);
  } else if (w.visual === 'behemothBase') {
    ctx.drawImage(behemothBaseSpriteImg, w.x, w.y, w.w, w.h);
  } else if (w.visual === 'tent') {
    ctx.fillStyle = campDestroyed ? '#8a8478' : '#d8d4c8';
    ctx.beginPath();
    ctx.moveTo(w.x, w.y + w.h);
    ctx.lineTo(w.x + w.w / 2, w.y);
    ctx.lineTo(w.x + w.w, w.y + w.h);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#33302a';
    ctx.lineWidth = 2;
    ctx.stroke();
    if (campDestroyed) {
      // Rips: a couple of jagged dark tears across the canvas.
      ctx.strokeStyle = '#1a1712';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(w.x + w.w * 0.35, w.y + w.h * 0.3);
      ctx.lineTo(w.x + w.w * 0.5, w.y + w.h * 0.55);
      ctx.lineTo(w.x + w.w * 0.4, w.y + w.h * 0.75);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(w.x + w.w * 0.6, w.y + w.h * 0.45);
      ctx.lineTo(w.x + w.w * 0.7, w.y + w.h * 0.68);
      ctx.stroke();
    }
  } else if (w.visual === 'tree') {
    const cx = w.x + w.w / 2, cy = w.y + w.h / 2;
    ctx.fillStyle = '#4a3524';
    ctx.fillRect(cx - w.w * 0.08, cy + w.h * 0.1, w.w * 0.16, w.h * 0.4);
    ctx.fillStyle = '#2f4a22';
    ctx.beginPath();
    ctx.arc(cx, cy - w.h * 0.05, Math.min(w.w, w.h) * 0.42, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1c2e14';
    ctx.lineWidth = 2;
    ctx.stroke();
  } else if (w.visual === 'house') {
    ctx.fillStyle = '#8a7256';
    ctx.fillRect(w.x, w.y + w.h * 0.35, w.w, w.h * 0.65);
    ctx.strokeStyle = '#3a2f22';
    ctx.lineWidth = 2;
    ctx.strokeRect(w.x, w.y + w.h * 0.35, w.w, w.h * 0.65);
    ctx.fillStyle = '#5a4636';
    ctx.beginPath();
    ctx.moveTo(w.x - 6, w.y + w.h * 0.35);
    ctx.lineTo(w.x + w.w / 2, w.y - 8);
    ctx.lineTo(w.x + w.w + 6, w.y + w.h * 0.35);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#2e241a';
    ctx.stroke();
    ctx.fillStyle = '#3a2f22';
    ctx.fillRect(w.x + w.w * 0.4, w.y + w.h * 0.6, w.w * 0.2, w.h * 0.4);
  } else if (w.visual === 'deadtree') {
    const cx = w.x + w.w / 2, cy = w.y + w.h / 2;
    ctx.strokeStyle = '#5a4a3a';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, w.y + w.h); ctx.lineTo(cx, cy - w.h * 0.15);
    ctx.moveTo(cx, cy); ctx.lineTo(cx - w.w * 0.32, cy - w.h * 0.32);
    ctx.moveTo(cx, cy - w.h * 0.08); ctx.lineTo(cx + w.w * 0.32, cy - w.h * 0.4);
    ctx.moveTo(cx, cy - w.h * 0.2); ctx.lineTo(cx - w.w * 0.2, cy - w.h * 0.48);
    ctx.stroke();
    ctx.lineCap = 'butt';
  } else if (w.visual === 'ruins') {
    ctx.fillStyle = '#8f8a80';
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeStyle = '#4d4a44';
    ctx.lineWidth = 2;
    ctx.strokeRect(w.x, w.y, w.w, w.h);
    ctx.strokeStyle = 'rgba(70,66,58,0.6)';
    ctx.beginPath();
    ctx.moveTo(w.x + w.w * 0.3, w.y); ctx.lineTo(w.x + w.w * 0.2, w.y + w.h);
    ctx.moveTo(w.x + w.w * 0.65, w.y); ctx.lineTo(w.x + w.w * 0.75, w.y + w.h);
    ctx.stroke();
  } else if (w.visual === 'lava') {
    const cx = w.x + w.w / 2, cy = w.y + w.h / 2, r = Math.min(w.w, w.h) / 2;
    ctx.fillStyle = '#2e2622';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff6a1f';
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd35c';
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.28, 0, Math.PI * 2); ctx.fill();
  } else if (w.visual === 'rock') {
    ctx.fillStyle = '#6b645c';
    ctx.beginPath();
    ctx.moveTo(w.x, w.y + w.h);
    ctx.lineTo(w.x + w.w * 0.15, w.y + w.h * 0.25);
    ctx.lineTo(w.x + w.w * 0.55, w.y);
    ctx.lineTo(w.x + w.w, w.y + w.h * 0.35);
    ctx.lineTo(w.x + w.w, w.y + w.h);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#3d3934';
    ctx.lineWidth = 2;
    ctx.stroke();
  } else {
    ctx.fillStyle = '#4a4f42';
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeStyle = '#22251d';
    ctx.lineWidth = 2;
    ctx.strokeRect(w.x, w.y, w.w, w.h);
  }
}

function drawCampfire(c) {
  if (campDestroyed) {
    // Blown-out logs — no flame — with a few wisps of smoke drifting up.
    ctx.beginPath();
    ctx.arc(c.x, c.y, 48, 0, Math.PI * 2);
    ctx.fillStyle = '#2a2620';
    ctx.fill();
    ctx.strokeStyle = '#141210';
    ctx.lineWidth = 3;
    ctx.stroke();
    const t = performance.now() / 500;
    for (let i = 0; i < 3; i++) {
      const rise = ((t + i * 1.7) % 3) / 3; // 0 (fresh) .. 1 (dissipated)
      const sx = c.x + Math.sin(t + i * 2) * 10;
      const sy = c.y - 70 - rise * 90;
      ctx.beginPath();
      ctx.arc(sx, sy, 14 + rise * 22, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(120,120,120,${(1 - rise) * 0.35})`;
      ctx.fill();
    }
    return;
  }
  // 4x the original size
  ctx.beginPath();
  ctx.arc(c.x, c.y, 48, 0, Math.PI * 2);
  ctx.fillStyle = '#5a3a1a';
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(c.x, c.y - 80);
  ctx.lineTo(c.x - 32, c.y - 8);
  ctx.lineTo(c.x + 32, c.y - 8);
  ctx.closePath();
  ctx.fillStyle = '#ff8c30';
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(c.x, c.y - 48);
  ctx.lineTo(c.x - 16, c.y - 8);
  ctx.lineTo(c.x + 16, c.y - 8);
  ctx.closePath();
  ctx.fillStyle = '#ffe27a';
  ctx.fill();
}

function drawBagProp() {
  if (!bagDropped || currentZoneId !== 'start') return;
  ctx.drawImage(bagSpriteImg, BAG_PROP.x - 15, BAG_PROP.y - 15, 30, 30);
  if (!activeDialogue && dist(player.x, player.y, BAG_PROP.x, BAG_PROP.y) < INTERACT_RANGE) {
    ctx.fillStyle = '#ffe27a';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Press Enter', BAG_PROP.x, BAG_PROP.y - 22);
    ctx.textAlign = 'left';
  }
}

function drawForestBagProp() {
  if (forestBagCollected || currentZoneId !== 'gapraForest') return;
  ctx.drawImage(bagSpriteImg, FOREST_BAG_PROP.x - 15, FOREST_BAG_PROP.y - 15, 30, 30);
  if (!activeDialogue && dist(player.x, player.y, FOREST_BAG_PROP.x, FOREST_BAG_PROP.y) < INTERACT_RANGE) {
    ctx.fillStyle = '#ffe27a';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Press Enter', FOREST_BAG_PROP.x, FOREST_BAG_PROP.y - 22);
    ctx.textAlign = 'left';
  }
}

function drawHealCutsceneMedic() {
  const hc = healCutscene;
  if (!hc || hc.phase === 'black') return;
  const w = 54, h = 48;
  ctx.drawImage(medicCatSpriteImg, hc.x - w / 2, hc.y - h / 2, w, h);
  ctx.fillStyle = '#fff';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Medic Cat', hc.x, hc.y - h / 2 - 8);
  ctx.textAlign = 'left';
}

function drawNpc(npc, interactable = true) {
  const w = npc.spriteW || 32, h = npc.spriteH || 32;
  ctx.drawImage(npc.sprite, npc.x - w / 2, npc.y - h / 2, w, h);
  ctx.fillStyle = '#fff';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(npc.name, npc.x, npc.y - h / 2 - 10);
  if (interactable && !activeDialogue && dist(player.x, player.y, npc.x, npc.y) < INTERACT_RANGE) {
    ctx.fillStyle = '#ffe27a';
    ctx.fillText('Press Enter', npc.x, npc.y + h / 2 + 16);
  }
  ctx.textAlign = 'left';
}

function draw() {
  if (screen !== 'game') {
    ctx.fillStyle = '#1a1f16';
    ctx.fillRect(0, 0, W, H);
    return;
  }

  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  const zoneGroundColor = ZONES[currentZoneId].groundColor;
  if (zoneGroundColor) {
    ctx.fillStyle = zoneGroundColor;
    ctx.fillRect(0, 0, worldW, worldH);
  }
  drawPolylines(ZONES[currentZoneId].paths, 'rgba(216,200,150,0.65)');
  drawPolylines(ZONES[currentZoneId].rivers, 'rgba(107,163,199,0.9)');

  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  const gridStartX = Math.floor(camera.x / 40) * 40, gridEndX = camera.x + W;
  const gridStartY = Math.floor(camera.y / 40) * 40, gridEndY = camera.y + H;
  for (let gx = gridStartX; gx <= gridEndX; gx += 40) { ctx.beginPath(); ctx.moveTo(gx, camera.y); ctx.lineTo(gx, camera.y + H); ctx.stroke(); }
  for (let gy = gridStartY; gy <= gridEndY; gy += 40) { ctx.beginPath(); ctx.moveTo(camera.x, gy); ctx.lineTo(camera.x + W, gy); ctx.stroke(); }

  ctx.strokeStyle = '#000';
  ctx.lineWidth = 8;
  ctx.strokeRect(4, 4, worldW - 8, worldH - 8);

  for (const ex of ZONES[currentZoneId].exits) {
    ctx.fillStyle = 'rgba(74,163,255,0.25)';
    ctx.fillRect(ex.x, ex.y, ex.w, ex.h);
    ctx.strokeStyle = 'rgba(74,163,255,0.7)';
    ctx.lineWidth = 2;
    ctx.strokeRect(ex.x, ex.y, ex.w, ex.h);
    ctx.fillStyle = '#dff0ff';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.save();
    ctx.translate(ex.x + ex.w / 2, ex.y + ex.h / 2);
    ctx.rotate(ex.w < ex.h ? -Math.PI / 2 : 0);
    ctx.fillText(ex.label, 0, 0);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  for (const w of walls) drawWall(w);
  if (!activeDialogue) {
    for (const w of walls) {
      if (!w.interactable) continue;
      if (circleOverlapsRect(player.x, player.y, INTERACT_RANGE, w)) {
        ctx.fillStyle = '#ffe27a';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Press Enter', w.x + w.w / 2, w.y - 8);
        ctx.textAlign = 'left';
      }
    }
  }
  if (ZONES[currentZoneId].campfire) drawCampfire(ZONES[currentZoneId].campfire);
  for (const npc of (ZONES[currentZoneId].npcs || [])) drawNpc(npc);
  if (currentZoneId === 'start' && (campEmergency === 'encounter' || campEmergency === 'fled')) drawNpc(medicCampNpc, false);
  drawBagProp();
  drawForestBagProp();
  drawHealCutsceneMedic();

  for (const it of loot) {
    ctx.beginPath();
    ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2);
    ctx.fillStyle = it.type === 'stone' ? (it.color === 'red' ? '#e14b4b' : '#9b4be1') : '#ffd35c';
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(it.x, it.y, it.r + 4, 0, Math.PI * 2);
    ctx.strokeStyle = it.type === 'stone'
      ? (it.color === 'red' ? 'rgba(225,75,75,0.5)' : 'rgba(155,75,225,0.5)')
      : 'rgba(255,211,92,0.5)';
    ctx.stroke();
  }

  for (const t of telegraphs) {
    if (t.shape === 'line') {
      ctx.save();
      ctx.translate(t.ox, t.oy);
      ctx.rotate(t.angle);
      if (!t.resolved) {
        ctx.fillStyle = 'rgba(255,40,40,0.28)';
        ctx.fillRect(0, -t.thickness / 2, t.length, t.thickness);
        ctx.strokeStyle = 'rgba(255,40,40,0.6)';
        ctx.lineWidth = 2;
        ctx.strokeRect(0, -t.thickness / 2, t.length, t.thickness);
      } else {
        ctx.fillStyle = `rgba(255,120,40,${clamp(t.impactFlash / 0.15, 0, 1) * 0.5})`;
        ctx.fillRect(0, -t.thickness / 2, t.length, t.thickness);
      }
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
      if (!t.resolved) {
        ctx.fillStyle = 'rgba(255,40,40,0.28)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,40,40,0.6)';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        ctx.fillStyle = `rgba(255,120,40,${clamp(t.impactFlash / 0.15, 0, 1) * 0.5})`;
        ctx.fill();
      }
    }
  }

  for (const e of enemies) if (e.hp > 0) drawEnemy(e);
  if (wildDoge && wildDoge.hp > 0) drawWildDoge(wildDoge);

  const playerForm = getPlayerForm();
  let formSpriteImg, formNativeW, formNativeH, formTint;
  if (playerForm === 'cinnabarEgg') {
    formSpriteImg = cinnabarEggSpriteImg; formNativeW = 20; formNativeH = 23; formTint = null;
  } else if (playerForm === 'courierCat') {
    formSpriteImg = courierCatSpriteImg; formNativeW = 41; formNativeH = 31; formTint = null;
  } else {
    formSpriteImg = catSpriteImg; formNativeW = 23; formNativeH = 24; formTint = null;
  }
  const spriteScale = 2;
  const spriteW = formNativeW * spriteScale, spriteH = formNativeH * spriteScale;
  const facingLeft = Math.cos(player.facing) < 0;
  ctx.save();
  ctx.translate(player.x, player.y);
  if (facingLeft) ctx.scale(-1, 1);
  ctx.drawImage(formSpriteImg, -spriteW / 2, -spriteH / 2, spriteW, spriteH);
  if (formTint) {
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = formTint;
    ctx.fillRect(-spriteW / 2, -spriteH / 2, spriteW, spriteH);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (playerForm === 'courierCat' && player.immuneTimer > 0) {
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = 'rgba(120,220,255,0.55)';
    ctx.fillRect(-spriteW / 2, -spriteH / 2, spriteW, spriteH);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (player.hitFlash > 0) {
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillRect(-spriteW / 2, -spriteH / 2, spriteW, spriteH);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  if (PLAYER_STATS.atkShape === 'line') {
    ctx.beginPath();
    ctx.moveTo(player.x + Math.cos(player.facing) * (spriteH / 2 - 4), player.y + Math.sin(player.facing) * (spriteH / 2 - 4));
    ctx.lineTo(player.x + Math.cos(player.facing) * (spriteH / 2 + 10), player.y + Math.sin(player.facing) * (spriteH / 2 + 10));
    ctx.strokeStyle = '#1c1c1c';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  for (const pt of particles) {
    ctx.globalAlpha = clamp(pt.life / pt.maxLife, 0, 1);
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  playerHpFill.style.width = (Math.max(0, player.hp) / PLAYER_STATS.hpMax * 100) + '%';
  levelXpEl.textContent = 'XP: ' + metaXP.toLocaleString();
  atkCdFill.style.width = (100 - clamp(player.atkCdTimer / PLAYER_STATS.atkCooldown, 0, 1) * 100) + '%';
  dashCdFill.style.width = (100 - clamp(player.dashCdTimer / PLAYER_STATS.dashCooldown, 0, 1) * 100) + '%';
}

let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - lastTime) / 1000);
  lastTime = now;
  doUpdate(dt);
  syncOverlays();
  draw();
  commitPrevKeys();
  anyKeyJustPressed = false;
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
